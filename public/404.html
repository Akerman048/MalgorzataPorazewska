<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | Małgorzata Porażewska</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />

    <style>
      :root {
        --bg: #f7f3eb;
        --text: #111111;
        --muted: #6b6b6b;
        --accent: #d6c08d;
        --card: rgba(255, 255, 255, 0.7);
        --border: rgba(17, 17, 17, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background:
          radial-gradient(
            circle at top,
            rgba(214, 192, 141, 0.18),
            transparent 35%
          ),
          var(--bg);
        color: var(--text);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .error-card {
        width: 100%;
        max-width: 720px;
        padding: 56px 32px;
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(8px);
        text-align: center;
      }

      .error-code {
        margin: 0 0 12px;
        font-size: clamp(64px, 12vw, 120px);
        line-height: 0.9;
        font-weight: 500;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      .error-title {
        margin: 0 0 16px;
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      .error-text {
        max-width: 520px;
        margin: 0 auto 32px;
        font-size: 16px;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 160px;
        padding: 14px 22px;
        border: 1px solid var(--text);
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text);
        background: transparent;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .button:hover {
        background: var(--text);
        color: white;
        transform: translateY(-1px);
      }

      .button--secondary {
        border-color: var(--border);
        color: var(--muted);
      }

      .button--secondary:hover {
        background: white;
        color: var(--text);
      }

      @media (max-width: 640px) {
        .error-card {
          padding: 40px 24px;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="error-card">
      <p class="error-code">404</p>
      <h1 class="error-title">Page not found</h1>
      <p class="error-text">
        The page you are looking for does not exist, may have been moved, or is
        temporarily unavailable.
      </p>

      <div class="actions">
        <a class="button" href="/">Back to home</a>
        <a class="button button--secondary" href="/works">View works</a>
      </div>
    </main>
  </body>
</html>
